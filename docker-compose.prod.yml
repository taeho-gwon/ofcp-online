services:
  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ofcp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: ${POSTGRES_DB:-ofcp}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  api:
    build:
      context: .
      args:
        # Vite는 VITE_* 환경변수를 빌드 시점에 번들에 inline.
        # GOOGLE_CLIENT_ID 변경 시 build를 다시 해야 프론트가 새 값을 쓴다.
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID required}
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ofcp}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ofcp}
      # 단일 도메인 운영이라 CORS 자체는 거의 의미가 없지만, 명시할 수 있음.
      # 예: ALLOWED_ORIGINS='["https://example.com"]'
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-["http://localhost"]}
      # 백엔드 id_token 검증용. 프론트 build arg와 동일한 값.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required}
      GAME_TTL_SECONDS: ${GAME_TTL_SECONDS:-86400}
    depends_on:
      - redis
      - postgres
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      # 도메인이 있으면 SITE_ADDRESS=example.com (자동 TLS), 없으면 :80 (HTTP만).
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    depends_on:
      - api
    restart: unless-stopped

volumes:
  redis_data:
  postgres_data:
  caddy_data:
  caddy_config:
