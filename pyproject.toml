[project]
name = "ofcp-online"
version = "0.1.0"
description = "Pineapple OFC Online Multiplayer Game"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.136.1",
    "pydantic-settings>=2.14.1",
    "redis>=7.4.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pre-commit>=4.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.15.12",
]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
