[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ofcp-online"
version = "0.1.0"
description = "Pineapple OFC Online Multiplayer Game"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "fastapi[standard]>=0.136.1",
    "google-auth>=2.36.0",
    "requests>=2.32.0",
    "pydantic-settings>=2.14.1",
    "pyjwt>=2.10.0",
    "redis>=7.4.0",
    "sqlalchemy[asyncio]>=2.0.36",
]

[project.scripts]
cli-game = "scripts.cli_game:main"

[tool.hatch.build.targets.wheel]
packages = ["app", "scripts"]

[dependency-groups]
dev = [
    "fakeredis>=2.35.1",
    "httpx>=0.27.0",
    "pre-commit>=4.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.15.12",
]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
