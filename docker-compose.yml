services:
  redis:
    image: redis:7-alpine
    # 127.0.0.1만 바인딩해 외부 노출 차단. 호스트의 백엔드는 그대로 접속 가능.
    # protected-mode는 docker bridge gateway(172.x.0.1)를 외부 IP로 보고 차단하므로 끔.
    # 외부 노출은 포트 매핑 레벨에서 차단됨.
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: ["redis-server", "--protected-mode", "no"]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ofcp
      POSTGRES_PASSWORD: ofcp
      POSTGRES_DB: ofcp
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  redis_data:
  postgres_data:
